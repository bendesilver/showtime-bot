name: Check showtimes

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: showtime-check

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MOVIE_URL: https://goldeneaglecinemasgh.com/movies/1003596-avengers-doomsday
        run: python run_once.py
      - name: Save state
        run: |
          git config user.name "showtime-bot"
          git config user.email "showtime-bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || (git commit -m "Update state" && git push)